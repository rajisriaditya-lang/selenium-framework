name: Selenium TestNG Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Cache Maven dependencies (speeds up future runs)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Step 4: Install Chrome (latest stable)
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Step 5: Run tests in headless mode
      - name: Run Selenium Tests
        run: mvn test -Dheadless=true
        continue-on-error: true  # don't stop workflow if tests fail — we still want the report

      # Step 6: Upload Extent HTML report as artifact
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()  # upload even if tests failed
        with:
          name: TestReport-${{ github.run_number }}
          path: reports/TestReport.html
          retention-days: 30

      # Step 7: Upload surefire reports as artifact
      - name: Upload Surefire Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SurefireReports-${{ github.run_number }}
          path: target/surefire-reports/
          retention-days: 30

      # Step 8: Print test result summary in GitHub UI
      - name: Test Summary
        if: always()
        run: |
          echo "========================================="
          echo " Selenium Test Run Complete"
          echo " Run Number: ${{ github.run_number }}"
          echo " Commit: ${{ github.sha }}"
          echo "========================================="
          cat target/surefire-reports/TestSuite.txt || echo "No surefire report found"
