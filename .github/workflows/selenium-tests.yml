name: Selenium TestNG Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Selenium Tests
        run: mvn test -Dheadless=true
        continue-on-error: true

      - name: Upload Test Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestReport-${{ github.run_number }}
          path: reports/TestReport.html
          retention-days: 30

      - name: Upload Surefire Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SurefireReports-${{ github.run_number }}
          path: target/surefire-reports/
          retention-days: 30

      # Publish report to GitHub Pages so it renders properly in browser
      - name: Deploy Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports
          publish_branch: gh-pages
          destination_dir: .
          commit_message: "CI Run #${{ github.run_number }} - Test Report"

      - name: Print Report URL
        if: always()
        run: |
          echo "========================================="
          echo " Test Report URL:"
          echo " https://rajisriaditya-lang.github.io/selenium-framework/TestReport.html"
          echo "========================================="
          cat target/surefire-reports/TestSuite.txt || echo "No surefire report found"
